<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>O&B_Dz - طاقم صلاة</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#111;
    color:white;
}

header{
    text-align:center;
    padding:40px 20px;
    background:#000;
}

.logo{
    font-size:40px;
    color:#d4af37;
    font-weight:bold;
}

h1,h2{
    color:#d4af37;
}

.container{
    padding:20px;
    text-align:center;
}

.card{
    background:#1c1c1c;
    border-radius:15px;
    padding:25px;
    margin:20px auto;
    max-width:500px;
    box-shadow:0 0 15px #d4af37;
}

.price{
    font-size:28px;
    color:#d4af37;
    font-weight:bold;
}

.colors span{
    display:inline-block;
    background:#333;
    padding:10px;
    margin:5px;
    border-radius:10px;
}

input, select, textarea{
    width:90%;
    padding:12px;
    margin:8px;
    border-radius:8px;
    border:none;
}

button{
    background:#d4af37;
    color:#000;
    padding:15px 30px;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:white;
}

a{
    color:#d4af37;
}
</style>

</head>

<body>

<header>
<div class="logo">O&B_Dz</div>
<h1>مرحبا بكم في عالم الأناقة</h1>
<p>منتجات مميزة بلمسة فاخرة وجودة عالية</p>
</header>


<div class="container">

<div class="card">

<h2>طاقم صلاة فاخر</h2>

<p>
تصميم أنيق ومريح، مناسب للاستعمال اليومي والهدايا.
</p>

<div class="price">
2000 دج
</div>

<div class="card">

<h2>استمارة الطلب</h2>

<input id="name" type="text" placeholder="الاسم واللقب">

<input id="phone" type="tel" placeholder="رقم الهاتف">

<input id="wilaya" type="text" placeholder="الولاية">

<select id="color">
<option>اختر اللون</option>
<option>ڨرونا</option>
<option>باج فونسي</option>
<option>فار مينيتار</option>
<option>أبيض</option>
<option>أسود</option>
<option>غوز</option>
<option>بلو فار</option>
</select>

<input id="quantity" type="number" placeholder="الكمية">

<textarea id="note" placeholder="ملاحظة"></textarea>

<br>

<button onclick="sendWhatsApp()">
اطلب الآن عبر واتساب
</button>

</div>


<script>
function sendWhatsApp(){

let name = document.getElementById("name").value;
let phone = document.getElementById("phone").value;
let wilaya = document.getElementById("wilaya").value;
let color = document.getElementById("color").value;
let quantity = document.getElementById("quantity").value;
let note = document.getElementById("note").value;

let message =
"طلب جديد من O&B_Dz%0A%0A"+
"الاسم: "+name+"%0A"+
"الهاتف: "+phone+"%0A"+
"الولاية: "+wilaya+"%0A"+
"اللون: "+color+"%0A"+
"الكمية: "+quantity+"%0A"+
"ملاحظة: "+note;

window.open("https://wa.me/213799229645?text="+message);
}
</script>
